name: Boring smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Tools
        run: |
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
          command -v go || brew install go
      - name: Build BoringSSL
        run: |
          chmod +x scripts/build_boringssl_ios.sh scripts/make_xcframework.sh
          ./scripts/build_boringssl_ios.sh
      - name: XcodeGen
        run: |
          PREFIX="$RUNNER_TEMP/xg"; mkdir -p "$PREFIX"
          curl -fsSL -o "$RUNNER_TEMP/xg.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xg.zip" -d "$RUNNER_TEMP/xg"
          bash "$RUNNER_TEMP/xg/xcodegen/install.sh" "$PREFIX"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - name: Generate
        run: xcodegen generate --spec project.yml
      - name: Build
        run: |
          xcodebuild build -project OpenCodeMobile.xcodeproj -scheme OpenCodeMobile -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SimDerived" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Launch
        run: |
          APP="$RUNNER_TEMP/SimDerived/Build/Products/Debug-iphonesimulator/OpenCodeMobile.app"
          UDID=$(xcrun simctl create OCM-Boring com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_OCM_BORING_TEST=1 xcrun simctl launch "$UDID" app.opencodemob.ios
          sleep 50
          CONTAINER=$(xcrun simctl get_app_container "$UDID" app.opencodemob.ios data)
          echo "CONTAINER=$CONTAINER"
          cat "$CONTAINER/Documents/boring-test.txt" || true
          ls -lh "$CONTAINER/Documents/boring-body.json" || true
          head -c 500 "$CONTAINER/Documents/boring-body.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console
          path: ${{ runner.temp }}/console.txt
          if-no-files-found: ignore
