name: HTTP client test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate body
        run: |
          python3 - <<'PY'
          import json, time, secrets, datetime
          prof=json.load(open('Resources/free-agent.json'))
          out=[]
          for line in prof['system'].splitlines():
              st=line.lstrip(' '); lead=line[:len(line)-len(st)]
              for prefix,val in [('Working directory: ','/var/mobile/Containers/Data/Application/ABC/Documents'),('Workspace root folder: ','/var/mobile/Containers/Data/Application/ABC/Documents'),('Is directory a git repo: ','no'),('Platform: ','ios'),("Today's date: ",'Tue Nov 03 2026')]:
                  if st.startswith(prefix): st=prefix+val
              out.append(lead+st)
          body={"model":"big-pickle","max_tokens":32000,"messages":[{"role":"system","content":'\n'.join(out)},{"role":"user","content":"Reply with exactly OK"}],"tools":prof['tools'],"tool_choice":"auto","stream":True,"stream_options":{"include_usage":True}}
          open('/tmp/freebody.json','w').write(json.dumps(body,ensure_ascii=False))
          chars='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'
          def ident(desc):
              ts=int(time.time()*1000); v=ts*0x1000+1
              if desc: v=~v
              v &= (1<<48)-1
              return format(v,'012x')+''.join(secrets.choice(chars) for _ in range(14))
          open('/tmp/ids','w').write('ses_'+ident(True)+'\n'+'msg_'+ident(False)+'\n')
          PY
          cat /tmp/ids
      - name: URLSession
        run: |
          cat > /tmp/http.swift <<'SWIFT'
          import Foundation
          let body = try! Data(contentsOf: URL(fileURLWithPath: "/tmp/freebody.json"))
          let ids = try! String(contentsOfFile: "/tmp/ids").split(separator: "\n").map(String.init)
          var req = URLRequest(url: URL(string: "https://opencode.ai/inference/openai/v1/chat/completions")!)
          req.httpMethod = "POST"
          req.httpBody = body
          req.timeoutInterval = 60
          req.setValue("Bearer public", forHTTPHeaderField: "Authorization")
          req.setValue("application/json", forHTTPHeaderField: "Content-Type")
          req.setValue("opencode/1.19.5 ai-sdk/provider-utils/4.0.23 runtime/bun/1.4.4", forHTTPHeaderField: "User-Agent")
          req.setValue("cli", forHTTPHeaderField: "x-opencode-client")
          req.setValue("global", forHTTPHeaderField: "x-opencode-project")
          req.setValue(ids[1], forHTTPHeaderField: "x-opencode-request")
          req.setValue(ids[0], forHTTPHeaderField: "x-opencode-session")
          req.setValue(ids[0], forHTTPHeaderField: "x-opencode-session-id")
          req.setValue("*/*", forHTTPHeaderField: "Accept")
          let sem = DispatchSemaphore(value: 0)
          URLSession.shared.dataTask(with: req) { data, response, error in
              print("ERROR", error as Any)
              print("STATUS", (response as? HTTPURLResponse)?.statusCode as Any)
              print("BODY", String(decoding: data ?? Data(), as: UTF8.self).prefix(800))
              sem.signal()
          }.resume()
          _ = sem.wait(timeout: .now() + 80)
          SWIFT
          swift /tmp/http.swift
