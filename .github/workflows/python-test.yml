name: Python mac test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run
        run: |
          set -euo pipefail
          clang scripts/python_mac_test.c -o /tmp/python_mac_test
          cd "$GITHUB_WORKSPACE"
          /tmp/python_mac_test