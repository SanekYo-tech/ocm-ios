name: Simulator smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: XcodeGen
        run: |
          PREFIX="$RUNNER_TEMP/xg"; mkdir -p "$PREFIX"
          curl -fsSL -o "$RUNNER_TEMP/xg.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xg.zip" -d "$RUNNER_TEMP/xg"
          bash "$RUNNER_TEMP/xg/xcodegen/install.sh" "$PREFIX"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - name: Generate
        run: xcodegen generate --spec project.yml
      - name: Build
        run: |
          xcodebuild build -project OpenCodeMobile.xcodeproj -scheme OpenCodeMobile -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SimDerived" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Launch
        run: |
          APP="$RUNNER_TEMP/SimDerived/Build/Products/Debug-iphonesimulator/OpenCodeMobile.app"
          UDID=$(xcrun simctl create OCM-Smoke com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_OCM_PY_TEST=1 timeout 35s xcrun simctl launch --console "$UDID" app.opencodemob.ios > "$RUNNER_TEMP/console.txt" 2>&1 || true
          echo '== console =='
          cat "$RUNNER_TEMP/console.txt"
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/smoke.png" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            ${{ runner.temp }}/console.txt
            ${{ runner.temp }}/smoke.png
          if-no-files-found: ignore
