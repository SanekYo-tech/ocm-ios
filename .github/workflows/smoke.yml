name: Simulator smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then XCODE_APP=/Applications/Xcode_16.4.app; else XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"; fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/xcodegen-prefix"
          mkdir -p "$PREFIX"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          bash "$RUNNER_TEMP/xcodegen/xcodegen/install.sh" "$PREFIX"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Pick simulator runtime
        id: sim
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes | grep -E 'iOS 18\.' | tail -n1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+).*/\1/')
          if [ -z "$RUNTIME" ]; then
            echo "No iOS 18 simulator runtime available" >&2
            xcrun simctl list runtimes >&2
            exit 1
          fi
          echo "RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          echo "Using runtime $RUNTIME"

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project OpenCodeMobile.xcodeproj -scheme OpenCodeMobile -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SimDerived" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO

      - name: Install and launch
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SimDerived/Build/Products/Debug-iphonesimulator/OpenCodeMobile.app"
          test -d "$APP"
          UDID=$(xcrun simctl create "OCM-Smoke" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          timeout 180 xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" app.opencodemob.ios || true
          sleep 12
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/smoke.png" || true
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "OpenCodeMobile"' --style compact > "$RUNNER_TEMP/smoke.log" || true
          echo '--- log ---'
          tail -120 "$RUNNER_TEMP/smoke.log"
          echo '--- markers ---'
          grep -E 'OCM (shell|python|git) self-test' "$RUNNER_TEMP/smoke.log" || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: |
            ${{ runner.temp }}/smoke.png
            ${{ runner.temp }}/smoke.log
          if-no-files-found: ignore
          retention-days: 7