name: OpenCodeMobile

options:
  bundleIdPrefix: app.opencodemob
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    EXPANDED_CODE_SIGN_IDENTITY: ""
    ONLY_ACTIVE_ARCH: "NO"
    ARCHS: "arm64"
    SKIP_INSTALL: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_OBJC_BRIDGING_HEADER: "Sources/Bridging-Header.h"
    CLANG_ENABLE_MODULES: "YES"
    HEADER_SEARCH_PATHS: "$(inherited) Vendor/libgit2/include Vendor/BoringSSL/include"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

targets:
  OpenCodeMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/python
        type: folder
      - path: Resources/Assets.xcassets
      - path: Resources/commandDictionary.plist
      - path: Resources/extraCommandsDictionary.plist
      - path: Resources/default-config.json
      - path: Resources/free-agent.json
    dependencies:
      - framework: Vendor/ios_system.xcframework
        embed: true
        link: true
      - framework: Vendor/files.xcframework
        embed: true
        link: false
      - framework: Vendor/shell.xcframework
        embed: true
        link: false
      - framework: Vendor/text.xcframework
        embed: true
        link: false
      - framework: Vendor/awk.xcframework
        embed: true
        link: false
      - framework: Vendor/tar.xcframework
        embed: true
        link: false
      - framework: Vendor/lg2.xcframework
        embed: true
        link: true
      - framework: Vendor/Python.xcframework
        embed: true
        link: false
      - framework: Vendor/BoringSSL.xcframework
        embed: false
        link: true
      - framework: Vendor/libssh2.xcframework
        embed: true
        link: false
      - framework: Vendor/openssl.xcframework
        embed: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "app.opencodemob.ios"
        PRODUCT_NAME: "OpenCodeMobile"
        INFOPLIST_FILE: "Info.plist"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_LDFLAGS: "$(inherited) -lc++"

schemes:
  OpenCodeMobile:
    build:
      targets:
        OpenCodeMobile: all
    run:
      config: Debug
    archive:
      config: Release